<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>七音竖笛 · 谐波合成 · v39</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
/* #stage 的基础排版必须写在各个 @media 之前：媒体查询里横屏会把它改成 grid，
   写在后面的基础规则会把 grid 覆盖回 flex（2026-11-25 踩过这个坑）。 */
#stage{width:100%;display:flex;flex-direction:column;align-items:center;margin:auto}
body{
    background:linear-gradient(160deg,#141414,#1f1f1f);
    display:flex;flex-direction:column;
    align-items:center;
    /* 2026-11-25：原来这里是 justify-content:center + overflow:hidden，
       窗口一矮（1366×768 的笔记本）底部就被切掉、还滚不动。
       改成子元素 margin:auto 居中：内容矮时居中，内容高时从顶部开始滚动。 */
    padding:16px 16px 76px;overflow-y:auto;overflow-x:hidden;
    font-family:"Microsoft YaHei",sans-serif;color:#ddd
}
h1{font-size:16px;font-weight:normal;color:#888;margin-bottom:14px;letter-spacing:1px}
.keys{display:flex;gap:14px;flex-wrap:nowrap;margin-bottom:20px}
.key{
    width:92px;height:92px;border-radius:50%;
    background:#f7f7f7;border:2px solid #ddd;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:transform .05s,background .05s,box-shadow .05s;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;flex-shrink:0;
    box-shadow:0 4px 12px rgba(0,0,0,.4)
}
.key.on{transform:scale(.92);background:#4a9eff;border-color:#2b7de0;
    box-shadow:0 0 24px rgba(74,158,255,.65)}
.key .num{font-size:30px;font-weight:bold;color:#222;line-height:1}
.key .nm{font-size:12px;color:#666;margin-top:4px}
.key.on .num{color:#fff}
.key.on .nm{color:#e8f2ff}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.05);padding:12px 16px;border-radius:14px;
    border:1px solid rgba(255,255,255,.08);max-width:660px}
.bar button,.bar select{
    padding:9px 16px;border:none;border-radius:8px;font-size:14px;
    font-family:inherit;cursor:pointer;background:#333;color:#ddd;transition:.2s}
.bar button:hover{background:#444}
.bar button.on{background:#e04040;color:#fff;animation:blink 1s infinite}
.bar select{background:#2a2a2a}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.status{margin-top:12px;font-size:13px;color:#888;height:18px}
.log-wrap{margin-top:14px;width:100%;max-width:660px;
    background:rgba(255,255,255,.04);border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    max-height:150px;overflow-y:auto;padding:10px 12px}
.log-wrap h4{font-size:13px;color:#888;margin-bottom:8px;font-weight:normal}
.log-item{display:flex;justify-content:space-between;align-items:center;
    padding:6px 8px;border-radius:6px;font-size:13px;color:#aaa;
    background:rgba(255,255,255,.03);margin-bottom:5px;cursor:pointer}
.log-item:hover{background:rgba(255,255,255,.08)}
.log-item .notes{color:#4a9eff;letter-spacing:2px}
.log-item .meta{color:#666;font-size:12px}
.log-empty{color:#555;font-size:13px;text-align:center;padding:10px}
.panel{margin-top:14px;width:100%;max-width:660px;
    background:rgba(255,255,255,.04);border-radius:12px;
    border:1px solid rgba(255,255,255,.08);overflow:hidden}
.panel-head{padding:10px 14px;font-size:13px;color:#888;
    cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;user-select:none}
.panel-head:hover{background:rgba(255,255,255,.03)}
.panel-head .toggle{transition:transform .2s;font-size:11px}
.panel.closed .toggle{transform:rotate(-90deg)}
.panel-body{padding:4px 14px 14px}
.panel.closed .panel-body{display:none}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.row label{width:70px;font-size:12px;color:#999;flex-shrink:0}
.row input[type=range]{flex:1;height:4px;-webkit-appearance:none;
    appearance:none;background:#3a3a3a;border-radius:2px;outline:none}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
    appearance:none;width:14px;height:14px;border-radius:50%;
    background:#4a9eff;cursor:pointer}
.row input[type=range]::-moz-range-thumb{width:14px;height:14px;
    border-radius:50%;background:#4a9eff;cursor:pointer;border:none}
.row .val{width:38px;text-align:right;font-size:12px;color:#4a9eff;
    font-family:monospace;flex-shrink:0}
.row.sep{margin-top:14px;padding-top:12px;
    border-top:1px solid rgba(255,255,255,.08)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns button{flex:1;padding:7px 10px;border:none;border-radius:6px;
    font-size:12px;font-family:inherit;cursor:pointer;
    background:#333;color:#ccc;transition:.2s;min-width:70px}
.btns button:hover{background:#444}
@media(max-width:520px){
    .row label{width:58px;font-size:11px}
    .btns button{font-size:11px;padding:6px 8px}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}
@media(max-width:700px){
    .keys{gap:9px}.key{width:72px;height:72px}
    .key .num{font-size:24px}.key .nm{font-size:10px}
    .bar button,.bar select{padding:7px 12px;font-size:13px}
}
@media(max-width:520px){
    .keys{gap:6px}.key{width:58px;height:58px}
    .key .num{font-size:20px}.key .nm{display:none}
}

/* ══════════ 手机适配（2026-11-25） ══════════
   原来的三个问题：
     ① html,body{height:100%} + body{overflow:hidden} → 内容比屏幕高就被锁死，底部面板够不着；
     ② .keys{flex-wrap:nowrap} → 7 个键在窄屏横向撑破；
     ③ viewport 里 user-scalable=no → 双指放大被禁。
   下面只在窄屏/矮屏覆盖，桌面观感一点不变。 */
@media (max-width: 820px), (max-height: 560px) {
  html{height:auto;min-height:100%}
  body{
    /* 不用 flex 居中：flex 居中 + 可滚动会把顶部截掉，改用 margin:auto */
    display:block;
    height:auto;min-height:100vh;min-height:100dvh;
    overflow-x:hidden;overflow-y:auto;
    padding:10px 10px calc(8px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
    text-align:center;
  }
  h1{margin:2px auto 12px;font-size:15px;letter-spacing:.5px}
  /* 间距用 margin 而不是 flex gap：老 X5 不认 gap，键会挤成一坨。 */
  .keys{flex-wrap:wrap;justify-content:center;gap:0;margin:0 auto 6px}
  .key{
    width:calc((100vw - 72px) / 4);
    height:calc((100vw - 68px) / 4);
    max-width:92px;max-height:92px;
    margin:14px 6px;
  }
  .key .num{font-size:clamp(18px,5vw,28px)}
  .key .nm{display:block;font-size:10px;margin-top:2px}
  .bar,.panel,.log-wrap{width:100%;max-width:660px;margin-left:auto;margin-right:auto}
  .bar{padding:10px 12px;gap:8px}
  .bar button,.bar select{padding:8px 12px;font-size:13px}
  .status{height:auto;min-height:18px;margin:8px auto 0}
  .panel{margin-top:10px}
  .log-wrap{margin-top:10px;max-height:32vh}
  .row label{width:62px;font-size:11px}
  .btns button{font-size:11px;padding:7px 8px;min-width:64px}

  /* 布局（2026-11-25）：琴键挪到最下面，拇指够得着；
     参数面板默认收起（JS 加 .closed），这样一屏就能看到键和工具条。
     #stage 撑到接近满屏 + 键区 margin-top:auto，键才会顶到屏幕底部。 */
  #stage{min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px)}
  h1{order:1}
  .bar{order:2}
  .status{order:3}
  .keys{order:4;margin:8px 0;padding:4px 0}
  .panel{order:5}
  .log-wrap{order:6}
}

/* 横屏手机（屏幕很矮）：工具条那一行拆成两格 ——
   左边一格放缩放 + 双键（就是主人截图里红框那块空白），右边一格放工具条。
   两格各自独立，不并进工具条、也不再单独占一行。 */
@media (orientation: landscape) and (max-height: 560px) {
  body{padding:8px 10px}
  h1{font-size:13px;margin-bottom:6px}
  #stage{
    min-height:0;
    display:grid;
    grid-template-columns:auto minmax(0, 1fr);
    gap:8px 10px;
    align-items:center
  }
  h1{grid-area:1 / 1 / 2 / 3}
  .keys{grid-area:2 / 1 / 3 / 3;margin:0 auto 8px}
  .zoombar{grid-area:3 / 1 / 4 / 2;justify-self:start;margin:0}
  .bar{grid-area:3 / 2 / 4 / 3;max-width:none;width:auto;padding:8px 10px}
  .status{grid-area:4 / 1 / 5 / 3}
  .panel{grid-area:5 / 1 / 6 / 3;margin-top:8px}
  .log-wrap{display:none}
  .keys{gap:8px}
  .key{width:56px;height:56px;max-width:none;max-height:none;margin:4px 5px}
  .key .nm{display:none}
  .status{min-height:0;margin:4px auto 0;font-size:12px}
}

/* ── 收尾：长按别弹选字/菜单，文字也别被系统放大 ──
   手机长按圆键会选中文字、顶出"复制/搜索"，在琴键上很碍事。
   用 `*` 加 !important：QQ/微信的 WebView 里，只在 body 上写 none 有时会被
   它自己的选字逻辑绕过（子元素/伪元素上还有 user-select:auto 的默认值）。
   输入框和下拉单独放行，否则连输入都点不进去。 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body,body *{
  -webkit-user-select:none !important;
  -moz-user-select:none !important;
  -ms-user-select:none !important;
  user-select:none !important;
  -webkit-touch-callout:none !important;
}
input,textarea,select{-webkit-user-select:auto !important;user-select:auto !important}

/* ── 页面自带缩放（2026-11-25）──
   QQ 内置浏览器把双指手势当成自己的，网页里写 user-scalable 也放不大，
   所以自己给一组 －/＋ 按钮；用 CSS zoom 缩放 #stage，会真正重排，不会横向溢出。
   位置用 position:sticky 而不是 fixed：fixed 在竖→横→竖 旋转时，
   有的浏览器不会跟着重排，整条会飘出屏幕（2026-11-25 实测反馈）。
   sticky 在文档流里，旋转只会重新算一次位置。 */
.zoombar{
  position:relative;margin:6px 4px 2px auto;
  display:flex;align-items:center;z-index:5;
  background:rgba(28,28,30,.92);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:3px 4px;box-shadow:0 4px 16px rgba(0,0,0,.5);
  width:max-content;max-width:100%
}
.zoombar button{
  width:36px;height:36px;border:none;border-radius:50%;background:transparent;
  color:#ddd;font-size:19px;line-height:1;font-family:inherit;cursor:pointer;
  padding:0
}
.zoombar button:active{background:rgba(255,255,255,.14)}
.zoombar #zoomVal{
  min-width:40px;text-align:center;font-size:11px;color:#9aa3b8;font-family:var(--mono,monospace)
}
/* 双键开关：只控制"一根手指压到两个键时要不要两个都响"，容差按方向自动取值 */
.zoombar #wideMode{
  width:auto;padding:0 10px;height:30px;border-radius:999px;
  font-size:11px;color:#9aa3b8;background:rgba(255,255,255,.06);margin-left:4px
}
.zoombar #wideMode.on{color:#0e1116;background:#4a9eff;font-weight:600}
/* 横屏时整条被搬进工具条里，去掉自己的外框，看起来就是工具条的一部分 */
.zoombar.in-bar{
  background:transparent;border:none;box-shadow:none;padding:0;margin:0 6px 0 0;border-radius:0
}

/* 放大后不给挤爆：滑杆默认有 intrinsic 最小宽度，zoom 放大时会把右侧数值顶出去 */
.row{min-width:0}
.row input[type=range]{min-width:0}
.row .val{flex:0 0 auto}

/* QQ/微信内置浏览器提示条 */
.outapp-hint{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:0 auto 10px;padding:8px 10px;max-width:660px;
  font-size:12px;line-height:1.5;color:#e8d9b0;text-align:center;
  background:rgba(221,159,63,.12);border:1px solid rgba(221,159,63,.35);border-radius:10px
}
.outapp-hint[hidden]{display:none}
.outapp-hint b{color:#f0c674;font-weight:600}
.outapp-hint button{
  flex:0 0 auto;width:24px;height:24px;border:none;border-radius:50%;
  background:transparent;color:#c9b98e;font-size:16px;line-height:1;cursor:pointer;padding:0
}
/* 预设按钮挪到面板顶部后，下面要留白，否则会贴住第一行滑杆（2026-11-25） */
.panel-body > .btns:first-child{margin-top:2px;margin-bottom:16px}
.panel-body > .btns:first-child button{padding:9px 10px}
</style>
</head>
<body>
<!-- 只在 QQ/微信内置浏览器里出现：那里的显示和缩放都有毛病，引导去系统浏览器。
     放在 #stage 外面，不受页面缩放影响。 -->
<div id="outAppHint" class="outapp-hint" hidden>
  <span>在 QQ 里可能显示不全，点右上角 <b>···</b> 选「在浏览器打开」</span>
  <button type="button" id="outAppHintClose" aria-label="关闭">×</button>
</div>
<div id="stage">

<h1>七音竖笛 · 奇次谐波合成 · v39</h1>

<div class="keys" id="keys">
    <div class="key" data-num="1"><div class="num">1</div><div class="nm">Do</div></div>
    <div class="key" data-num="2"><div class="num">2</div><div class="nm">Re</div></div>
    <div class="key" data-num="3"><div class="num">3</div><div class="nm">Mi</div></div>
    <div class="key" data-num="4"><div class="num">4</div><div class="nm">Fa</div></div>
    <div class="key" data-num="5"><div class="num">5</div><div class="nm">Sol</div></div>
    <div class="key" data-num="6"><div class="num">6</div><div class="nm">La</div></div>
    <div class="key" data-num="7"><div class="num">7</div><div class="nm">Si</div></div>
</div>

<div class="bar">
    <select id="scale">
        <option value="0">C 调</option>
        <option value="2">D 调</option>
        <option value="4">E 调</option>
        <option value="5">F 调</option>
        <option value="7">G 调</option>
        <option value="9">A 调</option>
        <option value="11">B 调</option>
    </select>
    <button id="recBtn">● 开始录制</button>
    <button id="playBtn">▶ 播放</button>
    <button id="pauseBtn">❚❚ 暂停</button>
    <button id="stopBtn">■ 停止</button>
    <button id="clearBtn">清空记录</button>
</div>

<div class="status" id="status">正在初始化…</div>

<div class="panel" id="panel">
    <div class="panel-head" id="panelHead">
        <span>谐波比例调节</span>
        <span class="toggle">▼</span>
    </div>
    <div class="panel-body">
        <div class="btns">
            <button id="presetFlute">竖笛默认</button>
            <button id="presetBright">明亮</button>
            <button id="presetSoft">柔和</button>
            <button id="presetOrgan">管风琴</button>
        </div>
        <div class="row">
            <label>基频 1f</label>
            <input type="range" id="h1" min="0" max="100" value="100">
            <span class="val" id="h1v">1.00</span>
        </div>
        <div class="row">
            <label>3次 3f</label>
            <input type="range" id="h3" min="0" max="100" value="42">
            <span class="val" id="h3v">0.42</span>
        </div>
        <div class="row">
            <label>5次 5f</label>
            <input type="range" id="h5" min="0" max="100" value="16">
            <span class="val" id="h5v">0.16</span>
        </div>
        <div class="row">
            <label>7次 7f</label>
            <input type="range" id="h7" min="0" max="100" value="7">
            <span class="val" id="h7v">0.07</span>
        </div>
        <div class="row">
            <label>9次 9f</label>
            <input type="range" id="h9" min="0" max="100" value="3">
            <span class="val" id="h9v">0.03</span>
        </div>
        <div class="row sep">
            <label>气息噪声</label>
            <input type="range" id="noiseAmt" min="0" max="100" value="30">
            <span class="val" id="noiseAmtv">0.30</span>
        </div>
        <div class="row">
            <label>颤音深度</label>
            <input type="range" id="vibAmt" min="0" max="100" value="45">
            <span class="val" id="vibAmtv">0.045</span>
        </div>
        <div class="row">
            <label>音头亮度</label>
            <input type="range" id="atkBright" min="0" max="200" value="180">
            <span class="val" id="atkBrightv">1.80</span>
        </div>
    </div>
</div>
<div class="log-wrap">
    <h4>播放记录（点击任意一条回放）</h4>
    <div id="logList"><div class="log-empty">还没有录制记录</div></div>
</div>
</div><!-- /#stage -->

<!-- 缩放条：放在 #stage 外面，自己不被缩放。
     QQ 内置浏览器把双指手势当成自己的，网页里放大不了；这里给一个自己的缩放。 -->
<div class="zoombar" id="zoombar">
    <button type="button" id="zoomOut" aria-label="缩小">－</button>
    <span id="zoomVal">100%</span>
    <button type="button" id="zoomIn" aria-label="放大">＋</button>
    <button type="button" id="wideMode" title="一根手指压到两个键时，要不要两个都响">双键 开</button>
</div>

<script>
(function(){"use strict";

/* ============================================================
   竖笛音色合成器
   闭管乐器只有奇次谐波：1f, 3f, 5f, 7f
   叠加正弦波 + 唇边湍流 + 气息噪声
   全部使用 Web Audio 内置节点，零自定义处理器
   ============================================================ */

// 谐波参数（可通过面板实时调节）
var HARMONICS = [
    {mult:1, amp:1.00, type:'sine'},
    {mult:3, amp:0.42, type:'sine'},
    {mult:5, amp:0.16, type:'sine'},
    {mult:7, amp:0.07, type:'sine'},
    {mult:9, amp:0.03, type:'sine'}
];
var NOISE_AMT = 0.30;
var VIB_AMT = 0.045;
var ATK_BRIGHT = 1.80;

function makeNoiseBuffer(ctx, seconds){
    var len = Math.floor(ctx.sampleRate * seconds);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++){
        d[i] = Math.random() * 2 - 1;
    }
    return buf;
}

function makeIR(ctx, sec, decay){
    var len = Math.floor(ctx.sampleRate * sec);
    var buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for(var ch = 0; ch < 2; ch++){
        var d = buf.getChannelData(ch);
        for(var i = 0; i < len; i++){
            var t = i / len;
            var env = Math.pow(1 - t, decay);
            var early = (i < ctx.sampleRate * 0.02) ? 1.6 : 1.0;
            d[i] = (Math.random() * 2 - 1) * env * early;
        }
    }
    return buf;
}

/* 单音符：创建一组振荡器，返回控制句柄 */
function playNote(ctx, dest, freq, vel, noiseBuf){
    var now = ctx.currentTime;
    var vol = 0.26 * (vel || 1.0);

    // 总音量包络：快速起音 → 稳定 → 释放
    var env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, now);
    env.gain.exponentialRampToValueAtTime(vol, now + 0.035);
    env.gain.setValueAtTime(vol, now + 0.035);
    env.gain.setTargetAtTime(vol * 0.85, now + 0.08, 0.15);

    var nodes = [];
    var oscs = [];

    // 谐波振荡器
    for(var i = 0; i < HARMONICS.length; i++){
        var h = HARMONICS[i];
        var osc = ctx.createOscillator();
        osc.type = h.type;
        osc.frequency.setValueAtTime(freq * h.mult, now);

        // 高次谐波略微失谐，增加自然感
        if(h.mult > 1){
            osc.detune.setValueAtTime((Math.random() - 0.5) * 6, now);
        }

        var g = ctx.createGain();
        g.gain.setValueAtTime(h.amp, now);

        // 高次谐波起音更快、衰减更快（音头亮，随后变柔）
              if(h.mult >= 5){
            g.gain.setValueAtTime(h.amp * ATK_BRIGHT, now);
            g.gain.exponentialRampToValueAtTime(h.amp * 0.6, now + 0.12);
        }

        osc.connect(g);
        g.connect(env);
        osc.start(now);
        oscs.push(osc);
        nodes.push(g);
    }

    // 唇边湍流：低频振荡调制基频幅度，模拟吹奏不稳
    var lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(4.5 + Math.random() * 1.5, now);
    var lfoGain = ctx.createGain();
    lfoGain.gain.setValueAtTime(vol * VIB_AMT, now);
    lfo.connect(lfoGain);
    lfoGain.connect(env.gain);
    lfo.start(now);
    oscs.push(lfo);

    // 气息噪声：带通滤波的白噪声，模拟气流声
    var noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;
    noise.loop = true;

    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq * 2.5, now);
    bp.Q.setValueAtTime(1.2, now);

    var noiseGain = ctx.createGain();
    // 音头气息重，之后减弱
    noiseGain.gain.setValueAtTime(vol * NOISE_AMT, now);
    noiseGain.gain.exponentialRampToValueAtTime(vol * NOISE_AMT * 0.2, now + 0.15);

    noise.connect(bp);
    bp.connect(noiseGain);
    noiseGain.connect(env);
    noise.start(now);

    env.connect(dest);

    return {
        env: env,
        oscs: oscs,
        noise: noise,
        nodes: nodes,
        stop: function(when){
            var t = when || ctx.currentTime;
            try{
                env.gain.cancelScheduledValues(t);
                env.gain.setValueAtTime(env.gain.value, t);
                env.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
            }catch(e){}
            for(var k = 0; k < oscs.length; k++){
                try{ oscs[k].stop(t + 0.32); }catch(e){}
            }
            try{ noise.stop(t + 0.32); }catch(e){}
            var self = this;
            setTimeout(function(){
                try{ self.env.disconnect(); }catch(e){}
                for(var k = 0; k < self.nodes.length; k++){
                    try{ self.nodes[k].disconnect(); }catch(e){}
                }
            }, 400);
        }
    };
}

/* ============================================================
   音频引擎初始化
   ============================================================ */
var ctx = null, master = null, convolver = null, noiseBuf = null;
var audioReady = false;
var statusEl = document.getElementById('status');

function initAudio(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){
        statusEl.textContent = '浏览器不支持 Web Audio，请用 Edge 或 Chrome';
        return false;
    }
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = 0.8;

    convolver = ctx.createConvolver();
    convolver.buffer = makeIR(ctx, 2.5, 2.2);
    var wet = ctx.createGain();
    wet.gain.value = 0.15;

    master.connect(ctx.destination);
    master.connect(convolver);
    convolver.connect(wet);
    wet.connect(ctx.destination);

    noiseBuf = makeNoiseBuffer(ctx, 2);

    audioReady = true;
    statusEl.textContent = '就绪 · 按键 A S D F J K L';
    return true;
}

/* ============================================================
   音高与键位
   ============================================================ */
var BASE = 261.63;
var SEMI = [0,2,4,5,7,9,11];
var SCALE_NAMES = ['C','D','E','F','G','A','B'];
var scaleSemi = 0;

function freqOf(num){
    var step = SEMI[parseInt(num,10) - 1];
    return BASE * Math.pow(2, (step + scaleSemi) / 12);
}
var KEYMAP = {a:'1', s:'2', d:'3', f:'4', j:'5', k:'6', l:'7'};

/* ============================================================
   发声管理
   ============================================================ */
var active = {};

function noteOn(num, vel, fromPlayback){
    if(!audioReady || !ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    if(active[num]) return;

    var handle = playNote(ctx, master, freqOf(num), vel || 1.0, noiseBuf);
    active[num] = handle;

    var el = document.querySelector('.key[data-num="'+num+'"]');
    if(el) el.classList.add('on');

    if(!fromPlayback && recState === 'recording'){
        recLog.push({num:num, t:performance.now() - recStart, v:vel||1.0});
    }
}

function noteOff(num){
    if(!active[num]) return;
    active[num].stop();
    delete active[num];

    var el = document.querySelector('.key[data-num="'+num+'"]');
    if(el) el.classList.remove('on');
}

/* ============================================================
   录制 / 回放
   ============================================================ */
var recState = 'idle';
var recLog = [];
var recStart = 0;
var playTimer = null;
var playIdx = 0;
var pauseAt = 0;

var recBtn = document.getElementById('recBtn');
var playBtn = document.getElementById('playBtn');
var pauseBtn = document.getElementById('pauseBtn');
var stopBtn = document.getElementById('stopBtn');
var clearBtn = document.getElementById('clearBtn');
var logList = document.getElementById('logList');
var scaleSel = document.getElementById('scale');

function setRecState(s){
    recState = s;
    recBtn.classList.toggle('on', s === 'recording');
    recBtn.textContent = (s === 'recording') ? '● 录制中…' : '● 开始录制';
    pauseBtn.textContent = (s === 'paused') ? '▶ 继续' : '❚❚ 暂停';
}

recBtn.onclick = function(){
    if(recState === 'recording'){
        stopPlayback();
        if(recLog.length > 0){
            saveLog(recLog.slice());
        }
        recLog = [];
        setRecState('idle');
        statusEl.textContent = '录制结束，已保存到记录';
    } else {
        stopPlayback();
        recLog = [];
        recStart = performance.now();
        setRecState('recording');
        statusEl.textContent = '录制中… 弹奏你的旋律';
    }
};

playBtn.onclick = function(){
    if(recState === 'playing') return;
    var logs = getLogs();
    if(logs.length === 0){
        statusEl.textContent = '没有可播放的记录，先录一段吧';
        return;
    }
    startPlayback(logs[0]);
};

pauseBtn.onclick = function(){
    if(recState === 'playing'){
        clearTimeout(playTimer);
        pauseAt = performance.now();
        setRecState('paused');
        statusEl.textContent = '已暂停';
    } else if(recState === 'paused'){
        var paused = performance.now() - pauseAt;
        recStart += paused;
        setRecState('playing');
        scheduleNext();
        statusEl.textContent = '播放中…';
    }
};

stopBtn.onclick = function(){
    stopPlayback();
    statusEl.textContent = '已停止';
};

clearBtn.onclick = function(){
    localStorage.removeItem('recorder_logs');
    renderLogs();
    statusEl.textContent = '记录已清空';
};

function stopPlayback(){
    clearTimeout(playTimer);
    for(var k in active){
        try{ active[k].stop(); }catch(e){}
    }
    active = {};
    document.querySelectorAll('.key.on').forEach(function(e){e.classList.remove('on');});
    if(recState === 'playing' || recState === 'paused') setRecState('idle');
}

function startPlayback(log){
    stopPlayback();
    recLog = log;
    playIdx = 0;
    recStart = performance.now();
    setRecState('playing');
    statusEl.textContent = '播放中… 共 ' + log.length + ' 个音';
    scheduleNext();
}

function scheduleNext(){
    if(recState !== 'playing') return;
    if(playIdx >= recLog.length){
        setTimeout(function(){
            if(recState === 'playing'){
                setRecState('idle');
                statusEl.textContent = '播放完毕';
            }
        }, 500);
        return;
    }
    var ev = recLog[playIdx];
    var delay = ev.t - (performance.now() - recStart);
    if(delay < 0) delay = 0;

    playTimer = setTimeout(function(){
        if(recState !== 'playing') return;
        noteOn(ev.num, ev.v, true);
        (function(n){
            setTimeout(function(){ noteOff(n); }, 280);
        })(ev.num);
        playIdx++;
        scheduleNext();
    }, delay);
}

/* ============================================================
   记录持久化
   ============================================================ */
function getLogs(){
    try{
        var s = localStorage.getItem('recorder_logs');
        return s ? JSON.parse(s) : [];
    }catch(e){ return []; }
}

function saveLog(log){
    var logs = getLogs();
    logs.unshift({
        notes: log.map(function(e){return e.num;}).join(''),
        events: log,
        time: new Date().toLocaleString('zh-CN')
    });
    if(logs.length > 20) logs = logs.slice(0, 20);
    try{ localStorage.setItem('recorder_logs', JSON.stringify(logs)); }catch(e){}
    renderLogs();
}

function renderLogs(){
    var logs = getLogs();
    if(logs.length === 0){
        logList.innerHTML = '<div class="log-empty">还没有录制记录</div>';
        return;
    }
    logList.innerHTML = '';
    logs.forEach(function(item, i){
        var div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = '<span class="notes">' + item.notes + '</span>' +
                        '<span class="meta">' + item.time + ' · ' +
                        item.events.length + '音</span>';
        div.onclick = function(){
            startPlayback(item.events);
        };
        logList.appendChild(div);
    });
}

/* ============================================================
   交互绑定（2026-11-25 改成按指针跟踪）
   原来每个键各绑 pointerdown/up/leave：
     · 按住后滑到别的键，pointerdown 不会再触发 —— 第二个键根本不响；
     · pointerleave 又会把前一个音关掉，于是"拖动只能一个音"。
   现在按 pointerId 记账：按住期间滑过哪个键就起哪个音，
   全部等到松手才一起停 —— 鼠标拖动能叠着响，两根手指也能同时按。
   ============================================================ */
var pointerNotes = {};   // pointerId -> [num, ...]

/* 双键开关（2026-11-25）：一根手指在系统里只上报一个点，
   "压到两个键"只能靠容差猜。猜小了只响一个，猜大了到处误触 —— 交给使用者自己拨。
   开 = 容差 22px（压在接缝/边缘时两个都响）；关 = 只认正下方那一个。 */
/* 双键容差（2026-11-25）：一根手指在系统里只上报一个点，"压到两个键"只能靠容差猜。
   固定按方向定档，不做开关：竖屏 13、横屏 22（横屏键更小，所以要松一点）。
   旋转屏幕时自动切，不需要用户操作。 */
function isShortLandscape(){
    return window.matchMedia
        ? window.matchMedia('(orientation: landscape) and (max-height: 560px)').matches
        : (window.innerWidth > window.innerHeight && window.innerHeight <= 560);
}
var wideOn = true;                                 // 双键总开关（只保留开/关，不调档）
try { wideOn = localStorage.getItem('dizi_wide_on') !== '0'; } catch(e){}
var wideBase = isShortLandscape() ? 22 : 13;

/* 触屏容差半径：wideBase = 0 时只认正下方那一个；否则按下用 wideBase、"离开"多 12px。
   12px 是迟滞：长按手指会微动，判定和保持用同一个半径会一抖就从两个键掉回一个。
   这里不再掺手机上报的接触宽度（各家差太多，反而让档位没法预期）。 */
function wideRadius(e, extra){
    if(e.pointerType !== 'touch' || !wideOn) return 0;
    return wideBase + (extra || 0);
}

/* 指针下方压着哪些键。两段合起来，任何浏览器至少不会"完全不响"：
     ① 先用 elementFromPoint 拿到正下方那一个 —— 这是最早就能用的路子，保底；
     ② 半径 > 0 时再把相邻的键加进来 —— 手指压住两个键时两个都响。
   鼠标半径恒为 0（精确点击，不误触）。 */
function keysUnderPointer(e, r){
    var out = [];
    var x = e.clientX, y = e.clientY;

    var el = document.elementFromPoint ? document.elementFromPoint(x, y) : null;
    while(el && el !== document.body){
        if(el.classList && el.classList.contains('key')){
            out.push(el.getAttribute('data-num'));
            break;
        }
        el = el.parentNode;
    }

    if(!r || r <= 0) return out;

    var keys = document.querySelectorAll('.key');
    for(var i = 0; i < keys.length; i++){
        var num = keys[i].getAttribute('data-num');
        if(out.indexOf(num) >= 0) continue;
        var b = keys[i].getBoundingClientRect();
        if(x + r >= b.left && x - r <= b.right && y + r >= b.top && y - r <= b.bottom){
            out.push(num);
        }
    }
    return out;
}

function holdNotes(pid, startNums, keepNums, opts){
    var retrigger = !!(opts && opts.retrigger);
    var list = pointerNotes[pid] || (pointerNotes[pid] = []);
    // 只停掉"连放宽后的范围都不在"的音（keepNums 比 startNums 宽，抖动不会误停）
    for(var i = list.length - 1; i >= 0; i--){
        if(keepNums.indexOf(list[i]) < 0){
            noteOff(list[i]);
            list.splice(i, 1);
        }
    }
    for(var j = 0; j < startNums.length; j++){
        var num = startNums[j];
        if(active[num]){
            // 已经响着：只在"刚按下"这一次重新起音（清掉可能卡住的音，保证每下都有 attack）。
            // 拖动过程中的 pointermove 不重触发，否则会变成机关枪。
            if(retrigger){
                noteOff(num);
                noteOn(num, 1.0, false);
            }
            if(list.indexOf(num) < 0) list.push(num);
            continue;
        }
        noteOn(num, 1.0, false);
        if(list.indexOf(num) < 0) list.push(num);
    }
}

function releasePointer(pid){
    var list = pointerNotes[pid];
    if(!list) return;
    delete pointerNotes[pid];
    for(var i = 0; i < list.length; i++) noteOff(list[i]);
}

document.addEventListener('pointerdown', function(e){
    if(recState === 'playing' || recState === 'paused') return;
    var nums = keysUnderPointer(e, wideRadius(e, 0));
    if(!nums.length) return;      // 只有按在键上才拦默认行为，别影响按钮
    e.preventDefault();
    holdNotes(e.pointerId, nums, nums, { retrigger: true });
});

document.addEventListener('pointermove', function(e){
    if(!pointerNotes[e.pointerId]) return;   // 只处理按住的那根
    // 起音用 22px，判断"要不要停"用 34px：手指抖几像素不会把第二个键判没
    holdNotes(
        e.pointerId,
        keysUnderPointer(e, wideRadius(e, 0)),
        keysUnderPointer(e, wideRadius(e, 12)),
        {}
    );
});

document.addEventListener('pointerup', function(e){ releasePointer(e.pointerId); });
document.addEventListener('pointercancel', function(e){ releasePointer(e.pointerId); });

/* 长按震动（2026-11-25）
   安卓长按会启动系统的"长按手势"（选字/长按菜单），启动那一下会震一下。
   user-select:none 只挡选中结果，挡不住这个手势本身；在 keys 上直接吃掉
   touchstart 的默认行为，手势就不会启动。只对键生效，不影响滚动和输入框。 */
document.addEventListener('touchstart', function(e){
    var el = e.target;
    while(el && el !== document.body){
        if(el.classList && el.classList.contains('key')){
            if(e.cancelable) e.preventDefault();
            return;
        }
        el = el.parentNode;
    }
}, { passive: false });

/* 拖到窗口外松手时 pointerup 可能收不到，兜底清干净，别留长鸣 */
window.addEventListener('blur', function(){
    for(var pid in pointerNotes) releasePointer(pid);
});

document.addEventListener('keydown', function(e){
    if(e.repeat) return;
    var num = KEYMAP[e.key.toLowerCase()];
    if(!num) return;
    if(recState === 'playing' || recState === 'paused') return;
    e.preventDefault();
    noteOn(num, 1.0, false);
});

document.addEventListener('keyup', function(e){
    var num = KEYMAP[e.key.toLowerCase()];
    if(!num) return;
    if(recState === 'playing' || recState === 'paused') return;
    noteOff(num);
});

scaleSel.addEventListener('change', function(){
    scaleSemi = parseInt(this.value, 10);
    statusEl.textContent = '已切换到 ' + SCALE_NAMES[[0,2,4,5,7,9,11].indexOf(scaleSemi)] + ' 调';
});

document.addEventListener('visibilitychange', function(){
    if(document.hidden){
        stopPlayback();
    }
});

/* ============================================================
   手机端键区尺寸（2026-11-25）
   QQ 内置浏览器用的是老 X5 内核，不认 aspect-ratio / min() / flex gap：
   CSS 里一旦靠这些算圆键尺寸，键就会塌成细条或者挤成一坨。
   所以这里直接量容器宽度、算出 px 写进 inline style —— 任何内核都认。
   宽屏（>820px 且不矮）交还给 CSS，清掉 inline 尺寸。
   ============================================================ */
function fitKeys(){
    var keys = document.getElementById('keys');
    if(!keys) return;
    var kids = keys.querySelectorAll('.key');
    if(!kids.length) return;
    var narrow = window.matchMedia
        ? window.matchMedia('(max-width: 820px), (max-height: 560px)').matches
        : (window.innerWidth <= 820);
    // 兜底：某些内置浏览器（QQ/微信的 WebView）会把页面按 980px 排版、无视 meta viewport，
    // 那时 matchMedia 全是宽屏、CSS 媒体查询也不生效。手机屏幕不宽却在按宽屏排版 → 当成窄屏。
    var screenW = window.screen ? window.screen.width : 0;
    var viewW = document.documentElement.clientWidth || window.innerWidth;
    if(screenW && screenW <= 600 && viewW > 820) narrow = true;
    var i;
    if(!narrow){
        for(i = 0; i < kids.length; i++){
            kids[i].style.width = '';
            kids[i].style.height = '';
        }
        return;
    }
    var shortLandscape = window.matchMedia
        ? window.matchMedia('(orientation: landscape) and (max-height: 560px)').matches
        : false;
    var cols = shortLandscape ? 7 : 4;   // 竖屏 4+3 两排，矮横屏 7 个一行
    var m = 6;                           // 左右 6px（横向空隙 12px）；上下由 CSS 的 margin:14px 拉开到 28px
    var w = keys.clientWidth || document.body.clientWidth || window.innerWidth;
    var size = Math.floor((w - cols * 2 * m - 2) / cols);
    if(size < 40) size = 40;
    if(size > 92) size = 92;
    for(i = 0; i < kids.length; i++){
        kids[i].style.width = size + 'px';
        kids[i].style.height = size + 'px';
    }
}
fitKeys();
window.addEventListener('resize', fitKeys);
window.addEventListener('orientationchange', function(){ setTimeout(fitKeys, 150); });
window.addEventListener('load', fitKeys);

/* 融合版：窄屏默认收起参数面板（键在底部，一屏先看到键和工具条） */
(function(){
    var p = document.getElementById('panel');
    if(!p) return;
    var narrow = window.matchMedia
        ? window.matchMedia('(max-width: 820px), (max-height: 560px)').matches
        : window.innerWidth <= 820;
    if(narrow) p.classList.add('closed');
})();

/* ============================================================
   缩放：QQ 内置浏览器禁了双指缩放，这里自己做一组按钮。
   用 CSS zoom 缩放 #stage（Chromium/WebView/Safari 都认），
   会真正重新排板，不会像 transform 那样把内容顶出屏幕。
   ============================================================ */
var ZOOM_MIN = 0.8, ZOOM_MAX = 2.0, ZOOM_STEP = 0.1;
var stageEl = document.getElementById('stage');
var zoomValEl = document.getElementById('zoomVal');
var zoomInBtn = document.getElementById('zoomIn');
var zoomOutBtn = document.getElementById('zoomOut');
var zoomLevel = 1;
try {
    var savedZoom = parseFloat(localStorage.getItem('dizi_zoom'));
    if(!isNaN(savedZoom)) zoomLevel = savedZoom;
} catch(e){}
zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomLevel));

function applyZoom(z){
    zoomLevel = Math.round(Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)) * 10) / 10;
    if(stageEl){
        if('zoom' in stageEl.style){
            stageEl.style.zoom = zoomLevel;
        }else{
            /* 老 Firefox 之类不认 zoom：只能 scale，至少能放大 */
            stageEl.style.transform = 'scale(' + zoomLevel + ')';
            stageEl.style.transformOrigin = 'top center';
        }
    }
    if(zoomValEl) zoomValEl.textContent = Math.round(zoomLevel * 100) + '%';
    try { localStorage.setItem('dizi_zoom', String(zoomLevel)); } catch(e){}
    fitKeys();
}

if(zoomInBtn) zoomInBtn.onclick = function(){ applyZoom(zoomLevel + ZOOM_STEP); };
if(zoomOutBtn) zoomOutBtn.onclick = function(){ applyZoom(zoomLevel - ZOOM_STEP); };
applyZoom(zoomLevel);

/* 双键开关：只切换"一根手指压到两个键要不要两个都响"，容差由方向决定（竖 13 / 横 22） */
var wideBtn = document.getElementById('wideMode');
function paintWide(){
    if(!wideBtn) return;
    wideBtn.textContent = wideOn ? '双键 开' : '双键 关';
    if(wideOn) wideBtn.className = 'on'; else wideBtn.className = '';
}
if(wideBtn){
    wideBtn.onclick = function(){
        wideOn = !wideOn;
        try { localStorage.setItem('dizi_wide_on', wideOn ? '1' : '0'); } catch(e){}
        paintWide();
    };
}
paintWide();

/* 横屏时缩放 + 双键单独成一条，插在工具条下面（竖屏还回页面底部）。
   2026-11-25 按主人要求：横屏不要把控件塞进工具条。 */
var zoombarEl = document.getElementById('zoombar');
var zoombarHome = zoombarEl ? { parent: zoombarEl.parentNode, next: zoombarEl.nextSibling } : null;
function placeZoombar(){
    if(!zoombarEl || !zoombarHome) return;
    var stageEl2 = document.getElementById('stage');
    var barEl = document.querySelector('.bar');
    if(!stageEl2 || !barEl) return;
    var land = window.matchMedia
        ? window.matchMedia('(orientation: landscape) and (max-height: 560px)').matches
        : false;
    if(land){
        if(zoombarEl.parentNode !== stageEl2 || barEl.nextSibling !== zoombarEl){
            stageEl2.insertBefore(zoombarEl, barEl.nextSibling);
            zoombarEl.classList.add('in-stage');
        }
    } else if(zoombarEl.parentNode !== stageEl2){
        // 竖屏：留在 #stage 最末，配合 margin:auto 推到底部右侧
        stageEl2.appendChild(zoombarEl);
        zoombarEl.classList.remove('in-stage');
    }
    // 容差跟着方向走：竖屏键大 → 13，横屏键小 → 22
    var wantWide = land ? 22 : 13;
    if(wantWide !== wideBase) wideBase = wantWide;
}
placeZoombar();
window.addEventListener('resize', placeZoombar);
window.addEventListener('orientationchange', function(){ setTimeout(placeZoombar, 150); });

/* ============================================================
   内置浏览器提示：QQ/微信的 WebView 里显示和缩放都有毛病，
   直接在页头提醒一句，引导到系统浏览器。关掉后不再出现。
   ============================================================ */
(function(){
    var box = document.getElementById('outAppHint');
    var closeBtn = document.getElementById('outAppHintClose');
    if(!box) return;
    var ua = navigator.userAgent || '';
    var inApp = /QQ\//.test(ua) || /MicroMessenger/i.test(ua);
    var dismissed = false;
    try { dismissed = localStorage.getItem('dizi_outapp_hint') === '1'; } catch(e){}
    if(inApp && !dismissed) box.hidden = false;
    if(closeBtn) closeBtn.onclick = function(){
        box.hidden = true;
        try { localStorage.setItem('dizi_outapp_hint', '1'); } catch(e){}
    };
})();

/* ============================================================
   长按选字兜底（2026-11-25）
   CSS 的 user-select:none 在部分内置浏览器里会被它自己的选字逻辑绕过，
   这里再从事件层面拦一道：选中、长按菜单、拖拽都掉。
   输入框/下拉/可编辑区放行，否则连字都打不进去。
   ============================================================ */
(function(){
    function isField(el){
        if(!el || !el.tagName) return false;
        var t = el.tagName.toLowerCase();
        return t === 'input' || t === 'textarea' || t === 'select' || el.isContentEditable;
    }
    document.addEventListener('selectstart', function(e){
        if(!isField(e.target)) e.preventDefault();
    }, false);
    document.addEventListener('contextmenu', function(e){
        if(!isField(e.target)) e.preventDefault();
    }, false);
    document.addEventListener('dragstart', function(e){
        if(!isField(e.target)) e.preventDefault();
    }, false);
})();

})();
</script>
</body>
